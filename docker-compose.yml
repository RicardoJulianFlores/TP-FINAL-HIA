# Sistema completo Joyería Lumière: BD, pgAdmin, Backend (Express) y Frontend (Angular + Nginx)
# Uso: cp .env.example .env -> completar datos -> docker compose up -d --build

services:

  # --- SPRINT 3: Observabilidad (Prometheus + Grafana + Métricas Docker) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: lumiere-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - admin-net

  grafana:
    image: grafana/grafana:latest
    container_name: lumiere-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - admin-net

  # --- SPRINT 3: Automatización (n8n) ---
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: lumiere-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=America/Argentina/Jujuy
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - admin-net
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: lumiere-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - admin-net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: lumiere-node-exporter
    restart: unless-stopped
    networks:
      - admin-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: lumiere-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}@db:5432/${DB_NAME:-trabajoFinal}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db-net
      - admin-net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: joyeria-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on:
      - frontend
    networks:
      - admin-net

  db:
    image: postgres:17-alpine
    container_name: lumiere-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-trabajoFinal}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - db-net

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: lumiere-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Defina PGADMIN_EMAIL en el archivo .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Defina PGADMIN_PASSWORD en el archivo .env}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db-net
      - admin-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: joyeria-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-trabajoFinal}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
      JWT_SECRET: ${JWT_SECRET:-secretkey}
      ACCESS_TOKEN: ${ACCESS_TOKEN:-APP_USR-1197074938502805-070311-2b5184f280c83c5f7022740503588a04-3517051204}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db-net
      - admin-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: joyeria-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - admin-net

volumes:
  pgdata:
    name: lumiere_pgdata
  pgadmin-data:
    name: lumiere_pgadmin_data
  n8n_data:
    name: lumiere_n8n_data
  grafana_data:
    name: lumiere_grafana_data

networks:
  db-net:
    internal: true       # Aislada: solo tráfico interno entre DB, Backend y pgAdmin
  admin-net: {}          # Puente: permite exponer puertos 8080, 3000 y 5050 hacia el host