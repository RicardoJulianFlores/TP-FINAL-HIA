global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job', 'instance']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'n8n-webhook'

receivers:
  - name: 'n8n-webhook'
    webhook_configs:
      - url: 'http://n8n:5678/webhook/alerta-prometheus'
        send_resolved: false
        http_config:
          bearer_token: 'LumiereWebhookSecret2026!'
