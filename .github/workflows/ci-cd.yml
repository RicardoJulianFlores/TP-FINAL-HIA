name: CI/CD Pipeline TP-FINAL-HIA Local

on:
  push:
    branches:
      - main

jobs:
  test-and-lint:
    runs-on: self-hosted
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Crear archivo .env
        run: |
          Set-Content -Path .env -Value "DB_PASSWORD=${{ secrets.DB_PASSWORD }}"
          Add-Content -Path .env -Value "PGADMIN_EMAIL=${{ secrets.PGADMIN_EMAIL }}"
          Add-Content -Path .env -Value "PGADMIN_PASSWORD=${{ secrets.PGADMIN_PASSWORD }}"

      - name: Validar sintaxis del docker-compose
        run: docker-compose config -q

  build-and-push:
    needs: test-and-lint
    runs-on: self-hosted
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/tp-final-hia:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Desplegar en la máquina local
        run: |
          docker-compose pull
          docker-compose up -d --remove-orphans